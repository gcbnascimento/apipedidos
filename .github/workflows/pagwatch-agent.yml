# Workflow de IMPLEMENTAÇÃO: recebe o conteúdo do card da ponte, cria uma issue com a
# instrução (derivada da descrição do card) e ATRIBUI ao coding agent (que abre PR).
#
# Disparado pela ponte quando o último comentário do card autoriza ("@pagwatch-agent
# pode implementar"). Recebe os MESMOS inputs do workflow de refinamento.
#
# COMO USAR (no repo de destino):
#   1. .github/workflows/pagwatch-agent.yml (branch default), SUBSTITUINDO o antigo.
#   2. Secret: CODING_AGENT_TOKEN (PAT de usuário com Copilot; atribuir agent exige
#      token de usuário, não o token do Actions).
#   3. Copilot coding agent habilitado no repositório.

name: PagWatch Agent

on:
  workflow_dispatch:
    inputs:
      issue_key:   { description: 'Jira card ID', required: true,  type: string }
      issue_type:  { description: 'Tipo do card', required: false, type: string }
      summary:     { description: 'Título',       required: false, type: string }
      description: { description: 'Descrição',     required: false, type: string }
      comments:    { description: 'Comentários',   required: false, type: string }

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  delegate-to-copilot:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CODING_AGENT_TOKEN }}
    steps:
      - name: Preparar instrução (a partir do card)
        id: prep
        env:
          ISSUE_KEY: ${{ github.event.inputs.issue_key }}
          ISSUE_TYPE: ${{ github.event.inputs.issue_type }}
          SUMMARY: ${{ github.event.inputs.summary }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: |
          set -euo pipefail
          # Prefixo da branch conforme o tipo do card (Bug -> fix, demais -> feature).
          TYPE_LC=$(echo "${ISSUE_TYPE:-}" | tr '[:upper:]' '[:lower:]')
          if [ "$TYPE_LC" = "bug" ] || [ "$TYPE_LC" = "fix" ]; then PREFIX="fix"; else PREFIX="feature"; fi

          {
            echo "title=[${ISSUE_KEY}] ${SUMMARY}"
            echo "prefix=${PREFIX}"
            echo "body<<__EOF__"
            echo "Implementar o card ${ISSUE_KEY}."
            echo ""
            echo "Título: ${SUMMARY}"
            echo ""
            echo "Descrição / requisito:"
            echo "${DESCRIPTION}"
            echo ""
            echo "Crie a implementação em uma branch ${PREFIX}/${ISSUE_KEY}-<resumo> a partir da branch base e abra um Pull Request."
            echo "_Issue criada automaticamente pela ponte PagWatch a partir do card ${ISSUE_KEY}._"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Descobrir o ID do coding agent
        id: copilot
        run: |
          echo "=== Atores assignaveis no repo ==="
          gh api graphql -f owner='${{ github.repository_owner }}' \
            -f name='${{ github.event.repository.name }}' -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 100) {
                  nodes { login __typename ... on Bot { id } ... on User { id } }
                }
              }
            }' | tee /tmp/actors.json

          COPILOT_ID=$(jq -r '.data.repository.suggestedActors.nodes[] | select(.login=="openai-code-agent" or .login=="anthropic-code-agent" or .login=="copilot-swe-agent" or .login=="Copilot") | .id' /tmp/actors.json | head -n1)

          if [ -z "$COPILOT_ID" ]; then
            echo "::error::Nenhum coding agent assignavel encontrado. Veja a lista acima."
            exit 1
          fi
          echo "id=$COPILOT_ID" >> "$GITHUB_OUTPUT"

      - name: Descobrir o ID do repositório
        id: repo
        run: |
          REPO_ID=$(gh api graphql -f owner='${{ github.repository_owner }}' \
            -f name='${{ github.event.repository.name }}' -f query='
            query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { id } }' \
            --jq '.data.repository.id')
          echo "id=$REPO_ID" >> "$GITHUB_OUTPUT"

      - name: Criar a issue
        id: issue
        run: |
          ISSUE_ID=$(gh api graphql \
            -f repositoryId="${{ steps.repo.outputs.id }}" \
            -f title="${{ steps.prep.outputs.title }}" \
            -f body="${{ steps.prep.outputs.body }}" \
            -f query='
            mutation($repositoryId: ID!, $title: String!, $body: String!) {
              createIssue(input: {repositoryId: $repositoryId, title: $title, body: $body}) {
                issue { id number url }
              }
            }' --jq '.data.createIssue.issue.id')
          echo "id=$ISSUE_ID" >> "$GITHUB_OUTPUT"

      - name: Atribuir a issue ao coding agent
        run: |
          gh api graphql \
            -f assignableId="${{ steps.issue.outputs.id }}" \
            -f actorId="${{ steps.copilot.outputs.id }}" \
            -f query='
            mutation($assignableId: ID!, $actorId: ID!) {
              replaceActorsForAssignable(input: {assignableId: $assignableId, actorIds: [$actorId]}) {
                assignable { ... on Issue { number } }
              }
            }'
          echo "Issue atribuida ao coding agent. Ele vai implementar e abrir um PR."

      - name: Comentar no Jira que a implementação começou
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CARD_ID: ${{ github.event.inputs.issue_key }}
        run: |
          set -euo pipefail
          TEXT="🚀 Implementação iniciada. O agente está trabalhando no card ${CARD_ID} e abrirá um Pull Request ao concluir."

          BODY=$(jq -n --arg t "$TEXT" '{
            body: { type: "doc", version: 1,
              content: [ { type: "paragraph", content: [ { type: "text", text: $t } ] } ] }
          }')

          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            -X POST "$JIRA_BASE_URL/rest/api/3/issue/$CARD_ID/comment" -d "$BODY")

          echo "Jira HTTP: $HTTP"
          if [ "$HTTP" != "201" ]; then
            echo "::warning::Nao foi possivel comentar no Jira (HTTP $HTTP). A implementacao segue."
            cat /tmp/resp.json || true
          else
            echo "Comentario 'implementacao iniciada' postado no card $CARD_ID."
          fi
