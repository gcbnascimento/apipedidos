name: PagWatch Agent

on:
  workflow_dispatch:
    inputs:
      issue_key:
        required: true
        type: string
      instruction:
        required: false
        type: string

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Echo do card recebido
        run: |
          echo "PagWatch Agent acionado pela ponte."
          echo "issue_key recebido: ${{ github.event.inputs.issue_key }}"
