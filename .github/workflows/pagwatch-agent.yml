# Workflow de REFINAMENTO (Opção A: o workflow refina com IA e comenta no Jira direto).
#
# Recebe do microserviço (ponte): issue_key, issue_type, summary, description, comments.
# 1. Usa GitHub Models (gh models run) para avaliar clareza e gerar o texto de refinamento.
# 2. Comenta o resultado no card do Jira via API REST.
#
# COMO USAR (no repo de destino):
#   1. Copie para .github/workflows/pagwatch-agent.yml (branch default), SUBSTITUINDO o antigo.
#   2. Secrets necessários (Settings > Secrets and variables > Actions):
#        JIRA_BASE_URL = https://jiraps-sandbox-943.atlassian.net
#        JIRA_EMAIL    = seu email do Jira
#        JIRA_TOKEN    = API token do Jira
#   3. A ponte já dispara este workflow com os inputs abaixo.

name: PagWatch Agent

on:
  workflow_dispatch:
    inputs:
      issue_key:   { description: 'Jira card ID', required: true,  type: string }
      issue_type:  { description: 'Tipo do card', required: false, type: string }
      summary:     { description: 'Título',       required: false, type: string }
      description: { description: 'Descrição',     required: false, type: string }
      comments:    { description: 'Comentários',   required: false, type: string }

permissions:
  contents: read
  models: read          # necessário para o gh models run

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Refinar o card com IA (GitHub Models)
        id: ai
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TYPE: ${{ github.event.inputs.issue_type }}
          SUMMARY: ${{ github.event.inputs.summary }}
          DESCRIPTION: ${{ github.event.inputs.description }}
          COMMENTS: ${{ github.event.inputs.comments }}
        run: |
          set -euo pipefail
          gh extension install github/gh-models || true

          PROMPT=$(cat <<EOF
          Você é um agente de refinamento de cards do Jira. Avalie se o card está claro o
          suficiente para implementação. Considere: objetivo único e acionável, componente/área
          afetada, e resultado esperado observável.

          Card:
          - Tipo: ${ISSUE_TYPE}
          - Título: ${SUMMARY}
          - Descrição: ${DESCRIPTION}
          - Comentários: ${COMMENTS}

          Responda em português, curto e objetivo:
          - Se estiver claro: comece com "PRONTO PARA IMPLEMENTAR" e resuma o que será feito.
          - Se faltar algo: comece com "REFINAMENTO NECESSÁRIO" e liste as perguntas/itens que faltam.
          EOF
          )

          echo "$PROMPT" | gh models run openai/gpt-4o-mini > /tmp/refino.txt || {
            echo "::error::Falha ao chamar o modelo (GitHub Models)."; exit 1;
          }

          echo "=== Refino gerado ==="
          cat /tmp/refino.txt

      - name: Comentar o refinamento no Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          CARD_ID: ${{ github.event.inputs.issue_key }}
        run: |
          set -euo pipefail
          REFINO=$(cat /tmp/refino.txt)

          # Monta o corpo ADF (Atlassian Document Format) com jq, escapando o texto.
          BODY=$(jq -n --arg t "$REFINO" '{
            body: {
              type: "doc", version: 1,
              content: [ { type: "paragraph", content: [ { type: "text", text: $t } ] } ]
            }
          }')

          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            -X POST "$JIRA_BASE_URL/rest/api/3/issue/$CARD_ID/comment" \
            -d "$BODY")

          echo "Jira HTTP: $HTTP"
          if [ "$HTTP" != "201" ]; then
            echo "::error::Falha ao comentar no Jira (HTTP $HTTP)."
            cat /tmp/resp.json || true
            exit 1
          fi
          echo "Comentário postado no card $CARD_ID."
